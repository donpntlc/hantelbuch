<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* Layout: phone-first app shell, one column (max 640px), fixed bottom tab bar, rest timer docked above it.
   Single deliberate dark look: black iron, brushed gold. */
:root{
  --bg:#0b0b0c; --surface:#151517; --surface2:#1d1d20; --line:#2a2a2e;
  --fg:#f2eee5; --muted:#8f8a7e; --gold:#c9a24a; --gold-hi:#e7c66d; --gold-ink:#17130a;
  --ok:#7cc287; --bad:#e5655b;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --nav-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
.brand b{color:var(--gold)}
.store{font-size:12px;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin:22px 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.02em;margin:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.tap{cursor:pointer;text-align:left;width:100%;display:block}
.card.tap:hover{border-color:#3a3a40}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font-weight:700;letter-spacing:.01em}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{background:var(--gold-hi)}
.btn.ghost{border:1px solid var(--line);background:var(--surface2)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.text{color:var(--gold);min-height:36px;padding:0 6px}
.btn.danger{color:var(--bad);border:1px solid #4a2522;background:transparent}
.btn.full{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.pr{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--gold-ink);background:var(--gold);border-radius:6px;padding:2px 6px;text-transform:uppercase}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--f-display);font-size:20px;letter-spacing:.02em;margin-bottom:4px}
.hero{padding:18px;background:linear-gradient(160deg,#1a1710 0%,var(--surface) 55%);border-color:#3a3220}
.hero .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;letter-spacing:.02em}

/* Active workout */
.wk-head{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.wk-name{background:transparent;border:0;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:28px;font-weight:700;padding:2px 0;width:100%;letter-spacing:.02em}
.wk-name:focus{outline:none;border-color:var(--gold)}
.timer{font-family:var(--f-display);font-size:20px;color:var(--gold)}
.ex{padding:12px 12px 8px}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ex-head h3{color:var(--gold-hi);min-width:0;overflow-wrap:anywhere;cursor:pointer}
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:4px 2px}
.sets td{text-align:center;padding:4px 2px}
.sets tr.done td{background:rgba(124,194,135,.09)}
.sets tr.done td:first-child{border-radius:8px 0 0 8px}
.sets tr.done td:last-child{border-radius:0 8px 8px 0}
.setno{width:34px;height:32px;border-radius:8px;font-weight:700;background:var(--surface2)}
.setno.w{color:var(--gold);}
.prev{font-size:13px;color:var(--muted);white-space:nowrap}
.cell{width:100%;max-width:84px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.cell.rpe{max-width:58px;padding:0 2px;font-size:15px;-webkit-appearance:none;appearance:none;text-align-last:center;color:var(--gold-hi)}
.cell:focus{outline:none;border-color:var(--gold)}
.cell::placeholder{color:#5a5750;font-weight:600}
.check{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.check svg{width:18px;height:18px;stroke:var(--muted)}
tr.done .check{background:var(--ok);border-color:var(--ok)}
tr.done .check svg{stroke:#0d1a10}

/* Rest bar + nav */
.restbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:20;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:#14120c;border-top:1px solid #3a3220}
.restbar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.restbar .t{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--gold-hi);min-width:78px}
.restbar .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:40px}
.restbar .bar i{display:block;height:100%;background:var(--gold)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:21;background:rgba(11,11,12,.96);border-top:1px solid var(--line);padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px));backdrop-filter:blur(8px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--gold)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow:auto;background:var(--surface);border-top:1px solid #3a3220;border-radius:18px 18px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:640px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin-top:4px}
.field{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.field:focus{outline:none;border-color:var(--gold)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:hover{background:var(--surface2)}
.li .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px 0}
.cats::-webkit-scrollbar{display:none}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--gold-hi);line-height:1.1}
.stat .k{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .ln{stroke:var(--gold);stroke-width:2;fill:none}
.chart .ar{fill:var(--gold);opacity:.12}
.chart .dot{fill:var(--gold-hi)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--surface2);display:block}
.daygrp{display:flex;flex-direction:column;gap:8px}
.wline{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.wline span:first-child{min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 80px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--surface2);border:1px solid var(--gold);color:var(--fg);padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.mini{font-size:13px}
.sep{height:1px;background:var(--line);margin:14px 0}
.ok{color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand" style="display:flex;align-items:center;gap:10px"><svg width="38" height="38" viewBox="0 0 180 180" aria-hidden="true" style="flex:none;border-radius:10px;background:#0a0a0a;border:1px solid #2a2418"><rect x="50" y="85" width="80" height="10" rx="3" fill="#c9a24a"/><rect x="35" y="59" width="12" height="62" rx="4" fill="#e7c66d"/><rect x="49" y="66" width="10" height="48" rx="4" fill="#c9a24a"/><rect x="121" y="66" width="10" height="48" rx="4" fill="#c9a24a"/><rect x="133" y="59" width="12" height="62" rx="4" fill="#e7c66d"/></svg><span>Hantel<b>buch</b></span></div>
    <div class="store" id="store">Lade …</div>
  </header>
  <main id="main"><div class="empty"><strong>Deine Daten werden geladen</strong>Gleich siehst du deine Routinen und dein letztes Training.</div></main>
</div>
<div class="restbar" id="restbar" hidden></div>
<nav class="tabs"><div class="in" id="nav"></div></nav>
<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<input type="file" id="soundIn" accept="audio/*,video/*,.mov,.mp4,.m4a,.mp3,.wav" hidden>
<input type="file" id="csvIn" accept=".csv,text/csv" hidden>

<script>
/* ---------- Übungsbibliothek ---------- */
const CATS=['Brust','Rücken','Schultern','Beine','Arme','Core','Athletik'];
const LIB=[
['Bankdrücken (Langhantel)','Brust'],['Schrägbankdrücken (Langhantel)','Brust'],['Bankdrücken (Kurzhantel)','Brust'],['Schrägbankdrücken (Kurzhantel)','Brust'],['Butterfly (Maschine)','Brust'],['Kabelzug-Fliegende','Brust'],['Dips','Brust'],['Liegestütze','Brust'],['Brustpresse (Maschine)','Brust'],
['Kreuzheben','Rücken'],['Klimmzüge','Rücken'],['Latzug','Rücken'],['Langhantelrudern','Rücken'],['Kurzhantelrudern','Rücken'],['Kabelrudern sitzend','Rücken'],['T-Bar-Rudern','Rücken'],['Face Pulls','Rücken'],['Hyperextensions','Rücken'],
['Schulterdrücken (Langhantel)','Schultern'],['Schulterdrücken (Kurzhantel)','Schultern'],['Seitheben','Schultern'],['Seitheben am Kabel','Schultern'],['Reverse Butterfly','Schultern'],['Frontheben','Schultern'],['Shrugs','Schultern'],
['Kniebeuge','Beine'],['Frontkniebeuge','Beine'],['Beinpresse','Beine'],['Hackenschmidt','Beine'],['Rumänisches Kreuzheben','Beine'],['Ausfallschritte','Beine'],['Bulgarian Split Squat','Beine'],['Step-ups','Beine'],['Beinstrecker','Beine'],['Beinbeuger liegend','Beine'],['Beinbeuger sitzend','Beine'],['Hip Thrust','Beine'],['Abduktoren (Maschine)','Beine'],['Adduktoren (Maschine)','Beine'],['Wadenheben stehend','Beine'],['Wadenheben sitzend','Beine'],
['Langhantelcurls','Arme'],['Kurzhantelcurls','Arme'],['Hammercurls','Arme'],['Kabelcurls','Arme'],['Scottcurls','Arme'],['Trizepsdrücken am Kabel','Arme'],['French Press','Arme'],['Enges Bankdrücken','Arme'],['Überkopf-Trizeps (Kabel)','Arme'],
['Plank (Sek.)','Core'],['Hängendes Beinheben','Core'],['Cable Crunch','Core'],['Ab Wheel','Core'],['Russian Twists','Core'],['Pallof Press','Core'],
['Power Clean','Athletik'],['Kettlebell Swing','Athletik'],['Box Jumps','Athletik'],['Broad Jumps','Athletik'],['Sled Push','Athletik'],['Medizinball-Wurf','Athletik'],['Sprints (m)','Athletik'],['Farmer\'s Walk','Athletik']
];

/* ---------- State ---------- */
const S={ready:false,mode:'local',routines:[],custom:[],workouts:[],body:[],active:null,tab:'training',rest:null,restDefault:90,sheet:null,exq:'',pq:'',pcat:'',edit:null,canPhotos:false};
let refs=null,assets=null,downloads=null;
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('de-CH',{maximumFractionDigits:1});
const fmt=n=>nf.format(Math.round((n||0)*10)/10);
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const e1rm=(kg,r)=>r<=0?0:(r===1?kg:kg*(1+r/30));
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const dur=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min'};
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fDate=t=>new Date(t).toLocaleDateString('de-CH',{weekday:'short',day:'numeric',month:'short'});
const fDay=k=>new Date(k+'T12:00').toLocaleDateString('de-CH',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const catOf=n=>(LIB.find(x=>x[0]===n)||S.custom.find(x=>x[0]===n)||[])[1]||'Eigene';

/* ---------- Speicherung ---------- */
const LS='hantelbuch.v1';
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}
function lsSave(){if(refs)return;try{localStorage.setItem(LS,JSON.stringify({routines:S.routines,custom:S.custom,seeded:S.seeded||[],workouts:S.workouts,body:S.body.map(b=>({...b,photos:[]})),active:S.active,restDefault:S.restDefault}))}catch(e){}}
const queues={};
function q(key,fn){const p=(queues[key]||Promise.resolve()).then(fn).catch(e=>{console.warn(e);toast(e&&e.code==='quota_exceeded'?'Speicher voll. Lösche alte Einträge.':'Speichern fehlgeschlagen. Prüfe deine Verbindung.')});queues[key]=p;return p}
function saveMeta(){if(refs){const d=clone({routines:S.routines,custom:S.custom,restDefault:S.restDefault,seeded:S.seeded||[],soundId:S.soundId||null});q('meta',()=>refs.meta.set(d))}else lsSave()}
let actT;function saveActive(now){clearTimeout(actT);const go=()=>{if(refs){const a=S.active?clone(S.active):null;q('active',()=>a?refs.active.set({w:a}):refs.active.delete())}else lsSave()};now?go():actT=setTimeout(go,600)}
function saveWorkout(w){if(refs){const d=clone(w);return q('w'+w.id,()=>refs.workouts.doc(w.id).set(d))}lsSave();return Promise.resolve()}
function delWorkout(id){S.workouts=S.workouts.filter(w=>w.id!==id);if(refs)q('w'+id,()=>refs.workouts.doc(id).delete());else lsSave()}
function saveBody(b){const i=S.body.findIndex(x=>x.date===b.date);if(i>=0)S.body[i]=b;else S.body.push(b);S.body.sort((a,c)=>c.date.localeCompare(a.date));if(refs){const d=clone(b);return q('b'+b.date,()=>refs.body.doc(b.date).set(d))}lsSave();return Promise.resolve()}

let pendingRender=false;
function soft(){const a=document.activeElement;if(a&&a.matches&&a.matches('#main input')){pendingRender=true;return}renderMain()}
document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(renderMain,0)}});

async function init(){
  renderNav();
  let d=null,u=null;
  try{if(window.claude&&claude.use){[d,u,assets,downloads]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets'),claude.use('downloads')])}}catch(e){}
  let id=null;try{id=u?await u.id():null}catch(e){}
  if(d&&id){
    S.mode='cloud';S.canPhotos=!!assets;
    const base='data/users/'+id;const meta=d.doc(base+'/app');
    refs={meta,active:d.doc(base+'/active'),workouts:meta.collection('workouts'),body:meta.collection('body')};
    let n=0;const ready=()=>{if(++n===3){S.ready=true;renderAll()}};
    let m1=false,m2=false,m3=false;
    meta.onSnapshot(s=>{const v=s.data()||{};S.routines=clone(v.routines||[]);S.custom=clone(v.custom||[]);if(v.restDefault)S.restDefault=v.restDefault;S.seeded=v.seeded||[];if(v.soundId!==S.soundId){S.soundId=v.soundId||null;customBuf=null}if(!m1){m1=true;seedRoutines();ready()}else soft()},fail);
    refs.workouts.orderBy('start','desc').limit(1000).onSnapshot(s=>{S.workouts=s.docs.map(x=>x.data());if(!m2){m2=true;ready()}else soft()},fail);
    refs.body.orderBy('date','desc').limit(1000).onSnapshot(s=>{S.body=s.docs.map(x=>clone(x.data()));if(!m3){m3=true;ready()}else soft()},fail);
    try{const a=await refs.active.get();if(a.exists&&a.data().w)S.active=clone(a.data().w)}catch(e){}
    if(S.ready)renderAll();
  }else{
    const v=lsLoad();Object.assign(S,{routines:v.routines||[],custom:v.custom||[],workouts:v.workouts||[],body:v.body||[],active:v.active||null,restDefault:v.restDefault||90,seeded:v.seeded||[],ready:true});
    seedRoutines();renderAll();
  }
  $('#store').textContent=S.mode==='cloud'?'In deinem Konto gespeichert':'Nur auf diesem Gerät gespeichert';
}
function fail(e){console.warn(e);if(!S.ready){S.ready=true;renderAll()}toast('Verbindung zum Speicher unterbrochen. Lade die Seite neu.')}

/* ---------- Auswertung ---------- */
function doneSets(ex){return (ex.sets||[]).filter(s=>s.done&&s.type!=='w')}
function wVolume(w){return w.exercises.reduce((a,e)=>a+doneSets(e).reduce((b,s)=>b+num(s.kg)*num(s.reps),0),0)}
function wSets(w){return w.exercises.reduce((a,e)=>a+doneSets(e).length,0)}
function bestSet(ex){let b=null;for(const s of doneSets(ex)){const v=e1rm(num(s.kg),num(s.reps));if(!b||v>b.v||(v===b.v&&num(s.kg)>num(b.s.kg)))b={s,v}}return b&&b.s}
function prevFor(name){for(const w of S.workouts){const e=w.exercises.find(x=>x.name===name);if(e&&e.sets.some(s=>s.done))return e.sets.filter(s=>s.done)}return null}
function bests(name,skipId){const r={kg:0,e1:0,vol:0,reps:0};for(const w of S.workouts){if(w.id===skipId)continue;const e=w.exercises.find(x=>x.name===name);if(!e)continue;for(const s of doneSets(e)){const kg=num(s.kg),rp=num(s.reps);r.kg=Math.max(r.kg,kg);r.e1=Math.max(r.e1,e1rm(kg,rp));r.vol=Math.max(r.vol,kg*rp);r.reps=Math.max(r.reps,rp)}}return r}
function sessions(name){const out=[];for(const w of S.workouts){const e=w.exercises.find(x=>x.name===name);if(e&&doneSets(e).length)out.push({w,e})}return out}
function ago(t){const d=Math.round((new Date(dayKey()+'T12:00')-new Date(dayKey(t)+'T12:00'))/864e5);return d<=0?'heute':d===1?'gestern':d<14?'vor '+d+' Tagen':d<60?'vor '+Math.round(d/7)+' Wochen':'vor '+Math.round(d/30)+' Monaten'}
function lastEx(name){const s=sessions(name)[0];return s?s.w.start:null}
function lastRoutine(r){const w=S.workouts.find(w=>w.routineId===r.id||w.name===r.name);return w?w.start:null}
function allNames(){const set=new Set([...LIB.map(x=>x[0]),...S.custom.map(x=>x[0])]);for(const w of S.workouts)for(const e of w.exercises)set.add(e.name);return [...set]}

/* chart: points [{x:label,y}] */
function chart(pts,unit){
  const W=320,H=150,L=38,R=10,T=12,B=22;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx-mn<1){mn-=1;mx+=1}const pad=(mx-mn)*.12;mn-=pad;mx+=pad;
  const X=i=>L+(pts.length===1?0:(i*(W-L-R)/(pts.length-1))),Y=v=>T+(mx-v)*(H-T-B)/(mx-mn);
  const ticks=[mn+(mx-mn)*.15,(mn+mx)/2,mx-(mx-mn)*.15];
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=line+` L${X(pts.length-1).toFixed(1)} ${H-B} L${L} ${H-B} Z`;
  const lab=k=>{const d=new Date((k.length===10?k+'T12:00':k));return isNaN(d)?'':d.toLocaleDateString('de-CH',{day:'numeric',month:'numeric'})};
  const lastI=pts.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf in ${unit}">
  ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="lbl" x="${L-6}" y="${(Y(t)+3).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`).join('')}
  <path class="ar" d="${area}"/><path class="ln" d="${line}"/>
  <circle class="dot" cx="${X(lastI).toFixed(1)}" cy="${Y(pts[lastI].y).toFixed(1)}" r="4"/>
  <text class="lbl" x="${L}" y="${H-6}">${lab(pts[0].x)}</text><text class="lbl" x="${W-R}" y="${H-6}" text-anchor="end">${lab(pts[lastI].x)}</text></svg>`;
}

let audioCtx=null;
function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();loadCustom()}catch(e){}}
function warCry(){const c=audioCtx,T=c.currentTime,out=c.createDynamicsCompressor();out.connect(c.destination);
 const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let k=0;k<nd.length;k++)nd[k]=Math.random()*2-1;
 const drum=t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,T+t);o.frequency.exponentialRampToValueAtTime(42,T+t+.35);g.gain.setValueAtTime(1,T+t);g.gain.exponentialRampToValueAtTime(.001,T+t+.5);o.connect(g);g.connect(out);o.start(T+t);o.stop(T+t+.55);
  const n=c.createBufferSource(),f=c.createBiquadFilter(),ng=c.createGain();n.buffer=nb;f.type='lowpass';f.frequency.value=900;ng.gain.setValueAtTime(.5,T+t);ng.gain.exponentialRampToValueAtTime(.001,T+t+.15);n.connect(f);f.connect(ng);ng.connect(out);n.start(T+t);n.stop(T+t+.2)};
 const shout=(t,d,p)=>{const mix=c.createGain();mix.gain.setValueAtTime(.001,T+t);mix.gain.exponentialRampToValueAtTime(.55,T+t+.04);mix.gain.setValueAtTime(.55,T+t+d*.6);mix.gain.exponentialRampToValueAtTime(.001,T+t+d);
  [[700,6],[1150,7],[2500,9]].forEach(([fq,q],k)=>{const b=c.createBiquadFilter();b.type='bandpass';b.frequency.setValueAtTime(fq,T+t);b.frequency.linearRampToValueAtTime(fq*.62,T+t+d);b.Q.value=q;const bg=c.createGain();bg.gain.value=[1,.6,.25][k];mix.connect(b);b.connect(bg);bg.connect(out)});
  for(let v=0;v<7;v++){const o=c.createOscillator();o.type='sawtooth';const f0=p*(1+(Math.random()-.5)*.09);o.frequency.setValueAtTime(f0*1.12,T+t);o.frequency.linearRampToValueAtTime(f0,T+t+.08);o.frequency.linearRampToValueAtTime(f0*.9,T+t+d);o.connect(mix);o.start(T+t+Math.random()*.03);o.stop(T+t+d+.05)}
  const n=c.createBufferSource(),hg=c.createGain();n.buffer=nb;hg.gain.value=.12;n.connect(hg);hg.connect(mix);n.start(T+t);n.stop(T+t+d)};
 drum(0);shout(.12,.38,118);drum(.7);shout(.82,.38,118);drum(1.4);drum(1.62);shout(1.75,1.1,128)}
function beep(){try{if(!audioCtx)return;if(customBuf)playCustom();else warCry()}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200,100,600])}catch(e){}}

}

function finishWorkout(){
  const a=clone(S.active);a.end=Date.now();
  a.exercises=a.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
  const prs=[];
  for(const e of a.exercises){if(!sessions(e.name).length)continue;const b=bests(e.name,a.id);const bs=bestSet(e);if(!bs)continue;const kg=num(bs.kg),r=num(bs.reps);
    const top=Math.max(...doneSets(e).map(s=>num(s.kg)));
    if(e1rm(kg,r)>b.e1+.01)prs.push({name:e.name,kind:'1RM',val:fmt(e1rm(kg,r))+' kg'});
    else if(top>b.kg)prs.push({name:e.name,kind:'Gewicht',val:fmt(top)+' kg'});}
  a.prs=prs;
  S.workouts=[a,...S.workouts.filter(w=>w.id!==a.id)];S.lastSaved=a;
  saveWorkout(a);S.active=null;S.rest=null;saveActive(true);
  renderAll();openSheet({type:'summary',id:a.id});
}

  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el)}
});
document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='rpe'){S.active.exercises[+el.dataset.i].sets[+el.dataset.j].rpe=el.value;saveActive()}
  else if(k==='kg'||k==='reps'){S.active.exercises[+el.dataset.i].sets[+el.dataset.j][k]=el.value.replace(/[^0-9.,]/g,'');saveActive()}
  else if(k==='wname'){S.active.name=el.value;saveActive()}
  else if(k==='exq'){S.exq=el.value;$('#exlist').innerHTML=exList()}
  else if(k==='pq'){S.pq=el.value;$('#plist').innerHTML=pList()}
  else if(k==='rname'){S.edit.name=el.value}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet();if(e.key==='Enter'&&e.target.id==='wIn')ACT['w-save']()});


/* ---------- Eigener Timer-Sound ---------- */
let customBuf=null,customLoading=null;
function wavFrom(buf){const sr=22050,len=Math.floor(buf.duration*sr),ch=buf.numberOfChannels;const off=new OfflineAudioContext(1,len,sr);const src=off.createBufferSource();src.buffer=buf;src.connect(off.destination);src.start();return off.startRendering().then(b=>{const d=b.getChannelData(0);const ab=new ArrayBuffer(44+d.length*2),v=new DataView(ab);const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+d.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,d.length*2,true);let pk=0;for(const x of d)pk=Math.max(pk,Math.abs(x));const g=pk>0?.98/pk:1;for(let i=0;i<d.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,d[i]*g))*32767,true);return new Blob([ab],{type:'audio/wav'})})}
function loadCustom(){if(customBuf||customLoading||!audioCtx)return;let p=null;
 if(S.soundId)p=fetch('/_blob/'+S.soundId).then(r=>r.arrayBuffer());
 else{let b64=null;try{b64=localStorage.getItem('hantelbuch.sound')}catch(e){}if(b64)p=fetch(b64).then(r=>r.arrayBuffer())}
 if(!p)return;customLoading=p.then(ab=>audioCtx.decodeAudioData(ab)).then(b=>{customBuf=b}).catch(()=>{}).finally(()=>{customLoading=null})}
function playCustom(){const s=audioCtx.createBufferSource();s.buffer=customBuf;s.connect(audioCtx.destination);s.start()}
$('#soundIn').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;unlockAudio();toast('Sound wird geladen …');
 try{const raw=await audioCtx.decodeAudioData(await f.arrayBuffer());const wav=await wavFrom(raw);customBuf=await audioCtx.decodeAudioData(await wav.arrayBuffer());
  if(assets&&refs){const r=await assets.upload(wav);S.soundId=r.id;saveMeta()}
  else{const fr=new FileReader();fr.onload=()=>{try{localStorage.setItem('hantelbuch.sound',fr.result)}catch(e){}};fr.readAsDataURL(wav)}
  renderSheet&&renderSheet();playCustom();toast('Eigener Sound gespeichert')}
 catch(err){console.warn(err);toast('Diese Datei konnte nicht gelesen werden. Probier MP3, M4A oder ein Video.')}});
/* ---------- Fotos ---------- */
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const m=1600,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',.84)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'))};img.src=url})}
$('#photoIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f||!assets)return;
  toast('Foto wird hochgeladen …');
  try{const blob=await shrink(f).catch(()=>f);const r=await assets.upload(blob);const k=dayKey();const b=clone(S.body.find(x=>x.date===k)||{date:k,photos:[]});b.photos=[...(b.photos||[]),{id:r.id,t:Date.now()}];await saveBody(b);renderMain();toast('Foto gespeichert')}
  catch(err){console.warn(err);toast('Foto konnte nicht gespeichert werden. Versuch es nochmals.')}
});

/* ---------- Strong-Import ---------- */
function parseCSV(t){const first=t.split('\n')[0];const d=first.split(';').length>first.split(',').length?';':',';const rows=[];let row=[],f='',qt=false;for(let i=0;i<t.length;i++){const c=t[i];if(qt){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else qt=false}else f+=c}else if(c==='"')qt=true;else if(c===d){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function parseDur(s){s=String(s||'');const h=+(s.match(/(\d+)\s*h/)||[0,0])[1],m=+(s.match(/(\d+)\s*m/)||[0,0])[1];return ((h*60+m)||60)*60000}
function importStrong(rows){
  const h=rows[0].map(x=>x.trim().toLowerCase().replace(/^﻿/,''));
  const col=(...k)=>h.findIndex(x=>k.some(y=>x.includes(y)));
  const cD=col('date','datum'),cW=col('workout name','workout-name','trainingsname','workout'),cE=col('exercise','übung'),cS=col('set order','satz'),cKg=col('weight','gewicht'),cR=col('reps','wdh','wiederh'),cDur=col('duration','dauer'),cSec=col('seconds','sekunden');
  if(cD<0||cE<0)throw new Error('format');
  const map=new Map();
  for(const r of rows.slice(1)){
    if(!r[cD]||!r[cE])continue;const en=r[cE].trim();if(/rest timer/i.test(en))continue;
    const start=new Date(r[cD].trim().replace(' ','T')).getTime();if(!isFinite(start))continue;
    const key=r[cD]+'|'+(cW>=0?r[cW]:'');
    let w=map.get(key);if(!w){w={id:'imp-'+hash(key),name:(cW>=0&&r[cW])||'Training',start,end:start+parseDur(cDur>=0?r[cDur]:''),exercises:[],imported:true};map.set(key,w)}
    let ex=w.exercises.find(x=>x.name===en);if(!ex){ex={name:en,rest:S.restDefault,sets:[]};w.exercises.push(ex)}
    const kg=cKg>=0?num(r[cKg]):0,reps=(cR>=0?num(r[cR]):0)||(cSec>=0?num(r[cSec]):0);if(!kg&&!reps)continue;
    ex.sets.push({kg:kg?String(kg):'',reps:reps?String(reps):'',done:true,type:cS>=0&&/w/i.test(r[cS])?'w':'n'});
  }
  return [...map.values()].map(w=>({...w,exercises:w.exercises.filter(e=>e.sets.length)})).filter(w=>w.exercises.length);
}
$('#csvIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;closeSheet();
  try{const ws=importStrong(parseCSV(await f.text()));if(!ws.length)return toast('Keine Trainings in der Datei gefunden.');
    toast(`${ws.length} Trainings werden importiert …`);
    const ids=new Set(ws.map(w=>w.id));S.workouts=[...ws,...S.workouts.filter(w=>!ids.has(w.id))].sort((a,b)=>b.start-a.start);renderMain();
    if(refs){let n=0;for(const w of ws){await saveWorkout(w);if(++n%25===0)toast(`${n} von ${ws.length} importiert …`)}}else lsSave();
    toast(`${ws.length} Trainings importiert`)}
  catch(err){console.warn(err);toast('Die Datei passt nicht. Nimm den CSV-Export aus Strong.')}
});

init();
</script>
